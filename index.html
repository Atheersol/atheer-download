<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f3d5e">

  <title>تحميل تطبيق الأثير</title>

  <meta
    name="description"
    content="تحميل تطبيق الأثير على أجهزة iPhone وAndroid."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #0f3d5e;
      --primary-dark: #092f49;
      --text: #13202b;
      --muted: #6b7785;
      --border: #e4e9ee;
      --surface: #ffffff;
      --background: #f6f8fa;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          var(--background) 100%
        );

      color: var(--text);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 28px;
    }

    .page {
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 24px;

      padding: 44px 38px 34px;

      box-shadow:
        0 18px 50px rgba(15, 61, 94, 0.08);

      text-align: center;
    }

    /* Company Logo */
    .logo {
      display: block;

      max-width: 190px;
      max-height: 95px;

      width: auto;
      height: auto;

      margin: 0 auto 28px;

      object-fit: contain;
    }

    h1 {
      font-size: 28px;
      line-height: 1.4;
      font-weight: 700;

      margin-bottom: 10px;

      color: var(--text);
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.8;

      max-width: 420px;

      margin: 0 auto;
    }

    /* Redirect Status */
    .status {
      margin-top: 32px;
      min-height: 82px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      border: 3px solid #e7edf1;
      border-top-color: var(--primary);

      animation: spin 0.8s linear infinite;

      margin-bottom: 14px;
    }

    .status-text {
      font-size: 14px;
      color: var(--muted);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Store Options */
    .store-section {
      display: none;
      margin-top: 30px;
    }

    .store-title {
      font-size: 14px;
      color: var(--muted);

      margin-bottom: 14px;
    }

    .store-list {
      display: grid;
      gap: 12px;
    }

    .store-link {
      min-height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px 16px;

      border-radius: 14px;

      text-decoration: none;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;

      direction: ltr;
    }

    .store-link:hover {
      transform: translateY(-1px);
    }

    /* App Store */
    .store-link.apple {
      background: #111111;
      color: #ffffff;

      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.12);
    }

    /* Google Play */
    .store-link.google {
      background: #ffffff;
      color: #151515;

      border: 1px solid var(--border);

      box-shadow:
        0 6px 18px rgba(15, 61, 94, 0.05);
    }

    .store-content {
      display: flex;
      align-items: center;

      gap: 14px;
    }

    .store-icon {
      width: 38px;
      min-width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .store-icon svg {
      width: 30px;
      height: 30px;

      display: block;
    }

    .store-text {
      text-align: left;
    }

    .store-caption {
      display: block;

      font-size: 10px;
      line-height: 1.2;

      opacity: 0.72;

      margin-bottom: 2px;
    }

    .store-name {
      display: block;

      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
    }

    .arrow {
      font-size: 20px;
      opacity: 0.6;

      margin-left: 8px;
    }

    /* Footer */
    .footer {
      margin-top: 28px;
      padding-top: 24px;

      border-top: 1px solid var(--border);

      font-size: 13px;
      line-height: 1.8;

      color: var(--muted);
    }

    .footer a {
      color: var(--primary);

      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .noscript {
      max-width: 560px;

      margin: 20px auto;
      padding: 18px;

      background: #fff8e5;

      border: 1px solid #f2df9d;
      border-radius: 12px;

      color: #6d5a18;

      text-align: center;

      font-family: Arial, sans-serif;
    }

    /* Mobile */
    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .card {
        border-radius: 20px;
        padding: 36px 22px 28px;
      }

      .logo {
        max-width: 165px;
        max-height: 84px;

        margin-bottom: 24px;
      }

      h1 {
        font-size: 24px;
      }

      .subtitle {
        font-size: 14px;
      }

      .store-link {
        min-height: 60px;

        padding: 10px 14px;
      }

      .store-name {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <!-- Atheer Logo -->
      <img
        src="./assets/logo.png"
        alt="شركة الأثير للحلول التقنية"
        class="logo"
      >

      <h1>تحميل تطبيق الأثير</h1>

      <p class="subtitle">
        سيتم توجيهك تلقائيًا إلى المتجر المناسب حسب نوع جهازك.
      </p>

      <!-- Redirect Loading -->
      <div id="status" class="status">

        <div class="spinner"></div>

        <div class="status-text">
          جاري فتح المتجر...
        </div>

      </div>

      <!-- Manual Store Selection -->
      <div id="storeSection" class="store-section">

        <div class="store-title">
          اختر المتجر المناسب لجهازك
        </div>

        <div class="store-list">

          <!-- Apple App Store -->
          <a
            class="store-link apple"
            href="https://apps.apple.com/us/app/atheer-app/id6799927385"
            aria-label="تحميل تطبيق الأثير من App Store"
          >

            <div class="store-content">

              <div class="store-icon">

                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35-.07 2.29.74 3.08.79 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.1zM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25z"
                  />
                </svg>

              </div>

              <div class="store-text">

                <span class="store-caption">
                  Download on the
                </span>

                <span class="store-name">
                  App Store
                </span>

              </div>

            </div>

            <span class="arrow">›</span>

          </a>

          <!-- Google Play -->
          <a
            class="store-link google"
            href="https://play.google.com/store/apps/details?id=com.atheersol.atheer_app"
            aria-label="تحميل تطبيق الأثير من Google Play"
          >

            <div class="store-content">

              <div class="store-icon">

                <svg
                  viewBox="0 0 512 512"
                  aria-hidden="true"
                >
                  <path
                    fill="#34A853"
                    d="M28 36L278 256 28 476c-8-8-13-20-13-35V71c0-15 5-27 13-35z"
                  />

                  <path
                    fill="#FBBC04"
                    d="M358 186L278 256 28 36c12-11 31-13 49-3z"
                  />

                  <path
                    fill="#4285F4"
                    d="M358 326L77 479c-18 10-37 8-49-3l250-220z"
                  />

                  <path
                    fill="#EA4335"
                    d="M465 225l-107-39-80 70 80 70 107-39c43-16 43-46 0-62z"
                  />
                </svg>

              </div>

              <div class="store-text">

                <span class="store-caption">
                  GET IT ON
                </span>

                <span class="store-name">
                  Google Play
                </span>

              </div>

            </div>

            <span class="arrow">›</span>

          </a>

        </div>

      </div>

      <!-- Footer -->
      <footer class="footer">

        <div>
          شركة الأثير للحلول التقنية
        </div>

        <a
          href="https://atheersol.com"
          target="_blank"
          rel="noopener noreferrer"
        >
          atheersol.com
        </a>

      </footer>

    </section>

  </main>

  <noscript>

    <div class="noscript">
      يرجى تفعيل JavaScript حتى يتم تحويلك تلقائيًا إلى متجر التطبيقات.
    </div>

  </noscript>

  <script>

    const APP_STORE_URL =
      "https://apps.apple.com/us/app/atheer-app/id6799927385";

    const GOOGLE_PLAY_URL =
      "https://play.google.com/store/apps/details?id=com.atheersol.atheer_app";

    const statusElement =
      document.getElementById("status");

    const storeSection =
      document.getElementById("storeSection");


    function showStoreOptions() {

      statusElement.style.display = "none";

      storeSection.style.display = "block";

    }


    function detectDevice() {

      const userAgent =
        navigator.userAgent ||
        navigator.vendor ||
        window.opera ||
        "";

      const isAndroid =
        /android/i.test(userAgent);

      const isIOS =
        /iPhone|iPad|iPod/i.test(userAgent) ||
        (
          navigator.platform === "MacIntel" &&
          navigator.maxTouchPoints > 1
        );


      if (isAndroid) {

        window.location.replace(GOOGLE_PLAY_URL);

        return;

      }


      if (isIOS) {

        window.location.replace(APP_STORE_URL);

        return;

      }


      // Desktop / unknown device
      showStoreOptions();

    }


    window.addEventListener(
      "DOMContentLoaded",
      detectDevice
    );

  </script>

</body>
</html>
